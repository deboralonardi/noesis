<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noesis — Cognitive Cyber Risk Assessment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #080B10;
    --bg-grid: #0C1017;
    --surface: #10141D;
    --surface-raised: #161C27;
    --line: #232C3A;
    --line-bright: #2F3D4E;
    --text: #ECEFF4;
    --text-dim: #93A0B3;
    --text-faint: #526075;
    --signal: #4FE0D6;
    --signal-bright: #7FF0E8;
    --signal-dim: #1E6E68;
    --signal-glow: rgba(79,224,214,0.4);
    --signal-glow-strong: rgba(79,224,214,0.55);
    --risk: #FF6152;
    --risk-dim: #4A2420;
    --risk-bg: rgba(255,97,82,0.08);
    --moderate: #F5A623;
    --moderate-dim: #4A3717;
    --moderate-bg: rgba(245,166,35,0.08);
    --calm: #46D18A;
    --calm-dim: #1B4632;
    --calm-bg: rgba(70,209,138,0.08);
    --midtone: #6C9BD1;
    --display: 'Sora', sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: center top;
  }

  .app { max-width: 1000px; margin: 0 auto; padding: 0 24px 100px; }
  ::selection { background: var(--signal-glow); color: #fff; }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 0; border-bottom: 1px solid var(--line);
    margin-bottom: 40px;
  }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wm-mark {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px 2px var(--signal-glow);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
  .wm-text { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: 0.02em; color: var(--text); }
  .wm-tagline { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin-left: 14px; padding-left: 14px; border-left: 1px solid var(--line); }
  .topbar-right { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.04em; }

  /* ---------- HUD PANEL FRAME ---------- */
  .hud-panel { position: relative; background: var(--surface); border: 1px solid var(--line); }
  .hud-corner { position: absolute; width: 14px; height: 14px; pointer-events: none; }
  .hud-corner.tl { top: -1px; left: -1px; border-top: 2px solid var(--signal); border-left: 2px solid var(--signal); }
  .hud-corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--signal); border-right: 2px solid var(--signal); }

  /* ---------- LANDING ---------- */
  .landing-hero { padding: 30px 0 20px; position: relative; }
  .hero-layout { display: grid; grid-template-columns: 1fr 380px; gap: 40px; align-items: start; }
  .hero-visual { position: relative; height: 480px; }
  .hero-visual-frame { width: 100%; height: 100%; border: 1px solid var(--line); background: var(--surface); overflow: hidden; position: relative; }
  @media (max-width: 800px) { .hero-layout { grid-template-columns: 1fr; } .hero-visual { height: 260px; } }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--signal); margin-bottom: 22px; display: flex; align-items: center; gap: 8px;
  }
  .eyebrow::before { content: ''; width: 16px; height: 1px; background: var(--signal); }
  .headline {
    font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.2; color: var(--text);
    max-width: 640px; margin: 0 0 18px; letter-spacing: -0.01em;
  }
  .headline-sub {
    font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.5; color: var(--text-dim);
    max-width: 560px; margin: 0 0 22px;
  }
  .headline-sub .accent { color: var(--signal); }
  .sub { font-size: 15px; line-height: 1.7; color: var(--text-dim); max-width: 560px; margin-bottom: 20px; }

  .hero-underline { width: 64px; height: 3px; background: var(--signal); box-shadow: 0 0 10px var(--signal-glow); margin-bottom: 24px; }
  .hero-waveform { margin: 26px 0 40px; }

  .landing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 40px; }
  .landing-cell { background: var(--surface); padding: 28px 24px; position: relative; overflow: hidden; }
  .landing-cell .lc-glow {
    width: 46px; height: 46px; border-radius: 50%; margin-bottom: 16px;
    background: radial-gradient(circle, rgba(79,224,214,0.22) 0%, rgba(79,224,214,0.02) 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .landing-cell .lc-glow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 10px 2px var(--signal-glow-strong); }
  .landing-cell .lc-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--signal); margin-bottom: 12px; }
  .landing-cell p { font-size: 13px; line-height: 1.65; color: var(--text-dim); margin: 0; }

  .not-block { background: var(--surface-raised); border-left: 2px solid var(--signal); padding: 20px 24px; margin-bottom: 40px; }
  .not-block .nb-title { font-family: var(--display); font-weight: 600; font-size: 13.5px; color: var(--text); margin-bottom: 8px; letter-spacing: 0.01em; }
  .not-block p { font-size: 13.5px; line-height: 1.65; color: var(--text-dim); margin: 0; }

  .btn-primary {
    background: var(--signal); color: #06110F; border: none; padding: 15px 30px;
    font-family: var(--display); font-weight: 600; font-size: 14px; cursor: pointer; letter-spacing: 0.01em;
    box-shadow: 0 0 0 0 var(--signal-glow); transition: box-shadow 0.2s ease, transform 0.15s ease;
  }
  .btn-primary:hover { box-shadow: 0 0 22px 2px var(--signal-glow); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    padding: 12px 20px; font-family: var(--mono); font-size: 11px; cursor: pointer; letter-spacing: 0.03em;
  }
  .btn-ghost:hover { border-color: var(--signal-dim); color: var(--signal); }
  .btn-ghost:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ---------- BEFORE YOU BEGIN ---------- */
  .byb-stage { padding: 60px 50px; max-width: 620px; margin: 0 auto; text-align: center; }
  .byb-eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--signal); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .byb-eyebrow::before, .byb-eyebrow::after { content: ''; width: 24px; height: 1px; background: var(--signal); opacity: 0.5; }
  .byb-title { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0 0 30px; }
  .byb-body { text-align: justify; }
  .byb-body p { font-size: 15px; line-height: 1.8; color: var(--text-dim); margin: 0 0 20px; }
  .byb-body strong { color: var(--text); }
  .byb-body p:last-child { margin-bottom: 0; }
  .byb-divider { width: 44px; height: 2px; background: var(--signal); box-shadow: 0 0 8px var(--signal-glow); margin: 0 auto 30px; }
  .byb-cta { margin-top: 38px; }

  /* ---------- PROGRESS RAIL ---------- */
  .progress-rail { display: flex; gap: 10px; margin-bottom: 34px; align-items: center; }
  .progress-seg { flex: 1; height: 28px; }
  .progress-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); white-space: nowrap; margin-left: 6px; letter-spacing: 0.04em; }

  /* ---------- STAGE ---------- */
  .stage { padding: 42px; }
  .stage-kicker { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  .stage-eyebrow { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.01em; color: var(--text); }
  .stage-index { font-family: var(--mono); font-size: 10.5px; color: var(--signal); letter-spacing: 0.05em; text-transform: uppercase; }

  .scenario-text { font-size: 16.5px; line-height: 1.75; color: var(--text-dim); max-width: 660px; margin-bottom: 32px; }
  .prompt-label { font-family: var(--display); font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 14px; letter-spacing: 0.01em; }

  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .choice {
    text-align: left; background: var(--surface-raised); border: 1px solid var(--line); color: var(--text);
    padding: 16px 18px; font-family: var(--body); font-size: 14px; line-height: 1.55; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .choice:hover { border-color: var(--signal-dim); }
  .choice.selected { border-color: var(--signal); background: rgba(79,224,214,0.06); }
  .choice .tag { display: inline-block; font-family: var(--mono); font-size: 10px; color: var(--signal); margin-right: 10px; }

  .source-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .source-card {
    text-align: left; background: var(--surface-raised); border: 1px solid var(--line); padding: 16px 18px;
    font-family: var(--body); font-size: 13px; line-height: 1.55; cursor: pointer; color: var(--text);
  }
  .source-card:hover { border-color: var(--signal-dim); }
  .source-card.selected { border-color: var(--signal); background: rgba(79,224,214,0.06); }
  .source-card .sc-num { font-family: var(--mono); font-size: 10px; color: var(--signal); display: block; margin-bottom: 8px; letter-spacing: 0.04em; }
  .source-hint { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin: -2px 0 16px; letter-spacing: 0.03em; }

  .confidence-block { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .confidence-row { display: flex; align-items: center; gap: 16px; }
  .confidence-row input[type=range] { flex: 1; accent-color: var(--signal); }
  .confidence-value { font-family: var(--mono); font-size: 13px; color: var(--signal); min-width: 42px; text-align: right; }

  .injected-info {
    background: var(--surface-raised); border-left: 2px solid var(--moderate); padding: 20px 22px;
    margin: 28px 0 32px; font-size: 15.5px; line-height: 1.7; color: var(--text-dim);
  }
  .injected-info .label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--moderate); margin-bottom: 10px; }

  .nav-row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }

  /* ---------- DASHBOARD ---------- */
  .dash-header { margin-bottom: 28px; }
  .dash-title { font-family: var(--display); font-weight: 600; font-size: 27px; margin: 0 0 8px; letter-spacing: -0.005em; }
  .dash-sub { font-size: 13px; color: var(--text-dim); font-family: var(--mono); letter-spacing: 0.01em; }

  .risk-banner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 30px; margin-bottom: 8px; border: 1px solid;
  }
  .risk-banner.HIGH { background: var(--risk-bg); border-color: rgba(255,97,82,0.35); }
  .risk-banner.ELEVATED, .risk-banner.MODERATE { background: var(--moderate-bg); border-color: rgba(245,166,35,0.35); }
  .risk-banner.LOW { background: var(--calm-bg); border-color: rgba(70,209,138,0.35); }
  .rb-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; opacity: 0.8; }
  .rb-level { font-family: var(--display); font-weight: 700; font-size: 30px; margin-top: 6px; letter-spacing: 0.01em; }
  .risk-banner.HIGH .rb-level, .risk-banner.HIGH .rb-label { color: var(--risk); }
  .risk-banner.ELEVATED .rb-level, .risk-banner.ELEVATED .rb-label,
  .risk-banner.MODERATE .rb-level, .risk-banner.MODERATE .rb-label { color: var(--moderate); }
  .risk-banner.LOW .rb-level, .risk-banner.LOW .rb-label { color: var(--calm); }
  .rb-note { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin: 0 0 26px; letter-spacing: 0.01em; }

  .section-block { margin-bottom: 26px; }
  .section-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1px; }
  .section-heading h2 { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--text); margin: 0; letter-spacing: 0.01em; }
  .section-heading .sh-q { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.02em; }
  .section-panel { background: var(--surface); border: 1px solid var(--line); padding: 26px; margin-top: 10px; }

  .vuln-row { margin-bottom: 22px; }
  .vuln-row:last-child { margin-bottom: 0; }
  .vuln-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 10px; }
  .vuln-name { color: var(--text); font-family: var(--body); font-weight: 500; }
  .vuln-level { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; }
  .vuln-level.strong { color: var(--risk); }
  .vuln-level.moderate { color: var(--moderate); }
  .vuln-level.weak { color: var(--calm); }

  .scale-track { position: relative; height: 4px; background: var(--line); border-radius: 2px; }
  .scale-labels { display: flex; justify-content: space-between; margin-top: 8px; }
  .scale-labels span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em; color: var(--text-faint); text-transform: uppercase; }
  .scale-marker { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); }
  .scale-marker.strong { background: var(--risk); box-shadow: 0 0 8px rgba(255,97,82,0.6); }
  .scale-marker.moderate { background: var(--moderate); box-shadow: 0 0 8px rgba(245,166,35,0.6); }
  .scale-marker.weak { background: var(--calm); box-shadow: 0 0 8px rgba(70,209,138,0.6); }

  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-chip { font-family: var(--mono); font-size: 10.5px; padding: 7px 11px; border: 1px solid var(--line); color: var(--text-dim); letter-spacing: 0.02em; }
  .tag-chip.warn { border-color: rgba(255,97,82,0.4); color: var(--risk); background: var(--risk-bg); }
  .tag-chip.good { border-color: rgba(70,209,138,0.4); color: var(--calm); background: var(--calm-bg); }
  .tag-chip.bad { border-color: rgba(255,97,82,0.4); color: var(--risk); background: var(--risk-bg); }

  .safeguard-list { display: flex; flex-direction: column; gap: 10px; }
  .safeguard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--surface-raised); border-left: 2px solid var(--line); }
  .safeguard-row.good { border-left-color: var(--calm); }
  .safeguard-row.bad { border-left-color: var(--risk); }
  .safeguard-row .sg-name { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--text); }
  .safeguard-row .sg-obs { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; }
  .safeguard-row.good .sg-obs { color: var(--calm); }
  .safeguard-row.bad .sg-obs { color: var(--risk); }

  /* ---------- MITIGATION ROADMAP (dominant section) ---------- */
  .roadmap-panel {
    background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--signal);
    padding: 36px; margin-top: 10px;
  }
  .roadmap-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .roadmap-heading h2 { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--text); margin: 0; }
  .roadmap-sub { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-bottom: 28px; }

  .roadmap-item { padding: 22px 0; border-top: 1px solid var(--line); }
  .roadmap-item:first-of-type { border-top: none; padding-top: 0; }
  .ri-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .ri-priority { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; color: var(--signal); text-transform: uppercase; }
  .ri-construct { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--text); }
  .ri-action { font-family: var(--body); font-weight: 600; font-size: 14.5px; color: var(--text); margin-bottom: 8px; }
  .ri-detail { font-size: 13.5px; line-height: 1.65; color: var(--text-dim); margin-bottom: 14px; max-width: 640px; }
  .ri-meta { display: flex; flex-wrap: wrap; gap: 10px; }
  .ri-meta span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.03em; color: var(--text-faint); border: 1px solid var(--line); padding: 5px 10px; }
  .ri-meta span.priority-high { color: var(--risk); border-color: rgba(255,97,82,0.35); }
  .ri-meta span.priority-medium { color: var(--moderate); border-color: rgba(245,166,35,0.35); }

  .roadmap-closing {
    margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .roadmap-closing .rc-text { max-width: 500px; }
  .roadmap-closing .rc-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--signal); margin-bottom: 6px; }
  .roadmap-closing .rc-desc { font-size: 13px; line-height: 1.6; color: var(--text-dim); }

  .footer-note {
    background: var(--surface); border: 1px solid var(--line); border-top: none;
    padding: 20px 28px; font-family: var(--mono); font-size: 10.5px; line-height: 1.75; color: var(--text-faint); letter-spacing: 0.01em;
  }

  .demo-flag {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-faint); border: 1px solid var(--line); padding: 5px 10px; margin-bottom: 22px;
  }
  .demo-flag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--moderate); }

  .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; }

  /* ---------- LONGITUDINAL ---------- */
  .longi-chart { background: var(--surface); border: 1px solid var(--line); padding: 32px; margin-bottom: 26px; }
  .longi-svg-wrap { width: 100%; overflow-x: auto; }
  .longi-legend { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .session-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-family: var(--body); }
  .session-table th { text-align: left; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .session-table td { padding: 13px 16px; border-bottom: 1px solid var(--line); color: var(--text-dim); }
  .session-table td.high-cell { color: var(--risk); font-family: var(--mono); font-size: 11px; }
  .session-table td.elevated-cell { color: var(--moderate); font-family: var(--mono); font-size: 11px; }
  .session-table td.moderate-cell { color: var(--midtone); font-family: var(--mono); font-size: 11px; }
  .session-table td.low-cell { color: var(--calm); font-family: var(--mono); font-size: 11px; }

  @media (max-width: 680px) {
    .landing-grid, .source-grid { grid-template-columns: 1fr; }
    .stage { padding: 28px 20px; }
    .headline { font-size: 28px; }
    .risk-banner { flex-direction: column; align-items: flex-start; gap: 12px; }
    .action-row { flex-direction: column; gap: 14px; align-items: stretch; }
    .roadmap-closing { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============ FRAMEWORK DATA ============ */

const SCENARIOS = [
  {
    id: 'anchoring',
    label: 'Anchoring',
    title: 'Vendor Anomaly',
    kind: 'reassess',
    narrative: `A critical vendor supporting payment processing has shown anomalous traffic patterns in the systems that connect to the vendor for payment processing over the last 48 hours. Your internal monitoring team flags the anomaly as "likely related to a scheduled infrastructure update on the vendor's side," citing an email from the vendor confirming planned maintenance during this period. There is no direct evidence of compromise yet. The vendor has been a partner for six years, with no known prior security incidents.`,
    prompt: 'Initial decision — what do you do?',
    choices: [
      { id: 'A', text: 'Accept the vendor\'s explanation — no immediate escalation is necessary.' },
      { id: 'B', text: 'Proceed with an independent verification before closing the case.' },
      { id: 'C', text: 'Request detailed logs from the vendor before deciding.' }
    ],
    confidence: true,
    injected: {
      label: 'Update',
      text: 'Six hours later, an independent analysis of network traffic finds that the anomalous patterns do not match typical infrastructure-update behaviour. Two IPs involved in the data exchange do not appear on the vendor\'s declared asset list.'
    },

/* ============ WAVEFORM (progress rail + landing decorative wave only) ============ */

function waveformPath(w, h, amp) {
  const points = [0, 0.35, -0.55, 0.75, -0.25, 0.6, -0.7, 0.45, -0.35, 0.85, -0.4, 0.25, 0];
  const n = points.length - 1;
  const stepX = w / n;
  const midY = h / 2;
  let d = `M 0 ${midY.toFixed(1)}`;
  points.forEach((p, i) => {
    const x = i * stepX;
    const y = midY - p * amp * (h / 2 - 3);
    d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  });
  return d;
}
function waveformSVG(w, h, amp, color, glow) {
  const path = waveformPath(w, h, amp);
  const glowFilter = glow ? `filter="drop-shadow(0 0 3px ${color})"` : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" ${glowFilter} opacity="${0.35 + amp * 0.65}" />
  </svg>`;
}

/* ============ SCENARIO FLOW ============ */

function progressRail() {
  const total = SCENARIOS.length;
  const segs = SCENARIOS.map((s, i) => {
    let amp, color;
    if (i < state.scenarioIdx) { amp = 1; color = '#4FE0D6'; }
    else if (i === state.scenarioIdx) { amp = 0.6; color = '#4FE0D6'; }
    else { amp = 0.08; color = '#4E5769'; }
    return `<div class="progress-seg">${waveformSVG(200, 28, amp, color, i <= state.scenarioIdx)}</div>`;
  }).join('');
  return `<div class="progress-rail">${segs}<div class="progress-label">${state.scenarioIdx + 1} / ${total}</div></div>`;
}

function canGoForward() {
  const sc = SCENARIOS[state.scenarioIdx];
  const d = getScenarioData(sc.id);
  if (state.currentPhase === 'decide') return !!d.selectedChoice;
  if (state.currentPhase === 'sources') return d.selectedSources.length === 2;
  if (state.currentPhase === 'injected') return !!d.reassessChoice;
  if (state.currentPhase === 'final') return !!d.finalChoice;
  return false;
}

function navRow() {
  const isVeryFirst = state.scenarioIdx === 0 && state.currentPhase === 'decide';

}

  const sc = SCENARIOS[state.scenarioIdx];

function selectChoice(id) { getScenarioData(SCENARIOS[state.scenarioIdx].id).selectedChoice = id; render(); }
function selectReassess(id) { getScenarioData(SCENARIOS[state.scenarioIdx].id).reassessChoice = id; render(); }
function selectFinal(id) { getScenarioData(SCENARIOS[state.scenarioIdx].id).finalChoice = id; render(); }

function updateConfidence(v) {
  getScenarioData(SCENARIOS[state.scenarioIdx].id).confidence = parseInt(v, 10);
  document.getElementById('confval').textContent = v + '%';
}

function toggleSource(id) {
  const d = getScenarioData(SCENARIOS[state.scenarioIdx].id);
  const idx = d.selectedSources.indexOf(id);
  if (idx >= 0) d.selectedSources.splice(idx, 1);
  else {
    if (d.selectedSources.length >= 2) return;
    d.selectedSources.push(id);
  }
  render();
}

function goForward() {
  if (!canGoForward()) return;
  const sc = SCENARIOS[state.scenarioIdx];
  const phases = phasesFor(sc);
  const idx = phases.indexOf(state.currentPhase);

  if (idx < phases.length - 1) {
    state.currentPhase = phases[idx + 1];
    render();
    return;
  }

  // last phase of this scenario — score it
  const d = getScenarioData(sc.id);
  let result;
  if (sc.kind === 'sources') result = scoreConfirmationScenario(d.selectedChoice, d.selectedSources, d.finalChoice, d.confidence);
  else result = scoreReassessScenario(sc.id, d.selectedChoice, d.reassessChoice, d.confidence);
  state.results[sc.id] = result;

  if (state.scenarioIdx < SCENARIOS.length - 1) {
    state.scenarioIdx += 1;
    state.currentPhase = phasesFor(SCENARIOS[state.scenarioIdx])[0];
    render();
  } else {
    state.screen = 'dashboard';
    render();
  }
}

function goBack() {
  const sc = SCENARIOS[state.scenarioIdx];
  const phases = phasesFor(sc);
  const idx = phases.indexOf(state.currentPhase);

  if (idx > 0) {
    state.currentPhase = phases[idx - 1];
    render();
    return;
  }

  if (state.scenarioIdx > 0) {
    state.scenarioIdx -= 1;
    const prevPhases = phasesFor(SCENARIOS[state.scenarioIdx]);
    state.currentPhase = prevPhases[prevPhases.length - 1];
    render();
  } else {
    state.screen = 'beforeYouBegin';
    render();
  }
}

/* ============ SCORING ============ */

function scoreReassessScenario(id, initial, reassess, confidence) {
  let level = 'weak', controlActive = true;
  if (id === 'anchoring') {
    if (initial === 'A' && reassess === 'A') { level = confidence >= 60 ? 'strong' : 'moderate'; controlActive = false; }
    else if (reassess === 'B') { level = 'moderate'; controlActive = true; }
    else { level = 'weak'; controlActive = true; }
  } else if (id === 'authority') {
    if (reassess === 'A') { level = confidence <= 55 ? 'strong' : 'moderate'; controlActive = false; }
    else if (reassess === 'B') { level = 'moderate'; controlActive = true; }
    else { level = 'weak'; controlActive = true; }
  } else if (id === 'automation') {
    if (reassess === 'A') { level = confidence >= 55 ? 'strong' : 'moderate'; controlActive = false; }
    else if (reassess === 'B') { level = 'moderate'; controlActive = true; }
    else { level = 'weak'; controlActive = true; }
  }
  return { level, controlActive, initial, reassess, confidence };
}

function scoreConfirmationScenario(hypothesis, sources, finalChoice, confidence) {
  const has4 = sources.includes(4);
  const has2 = sources.includes(2);
  let level = 'weak', controlActive = true;
  if (!has4 && !has2) { level = 'strong'; controlActive = false; }
  else if (!has4) { level = 'moderate'; controlActive = false; }
  else { level = 'weak'; controlActive = true; }
  return { level, controlActive, hypothesis, sources, finalChoice, confidence };
}

function goToLongitudinal() { state.screen = 'longitudinal'; render(); }
function goToDashboard() { state.screen = 'dashboard'; render(); }

/* ============ DASHBOARD ============ */

function computeOverall() {
  const levels = Object.values(state.results).map(r => r.level);
  const strongWithoutControl = Object.values(state.results).some(r => r.level === 'strong' && !r.controlActive);
  const strongWithControl = Object.values(state.results).some(r => r.level === 'strong' && r.controlActive);
  const moderateCount = levels.filter(l => l === 'moderate').length;
  if (strongWithoutControl) return 'HIGH';
  if (strongWithControl || moderateCount >= 2) return 'ELEVATED';
  if (moderateCount >= 1) return 'MODERATE';
  return 'LOW';
}

function scalePosition(level) {
  if (level === 'weak') return 16.5;
  if (level === 'moderate') return 50;
  return 83.5;
}

  const overall = computeOverall();

  app.innerHTML = `
    ${topbar()}
    <span class="demo-flag">Illustrative output — generated from fixed demo rules, not a validated scoring model</span>
    <div class="dash-header">
      <div class="dash-title">Cognitive Cyber Risk Profile</div>
      <div class="dash-sub">SESSION · ${new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase()} · 4 SCENARIOS COMPLETED</div>
    </div>

    <div class="risk-banner ${overall}">
      <div>
        <div class="rb-label">Overall Cognitive Cyber Risk</div>
        <div class="rb-level">${overall}</div>
      </div>
      <div style="text-align:right;">
        <div class="rb-label">Decision Criticality</div>
        <div class="rb-level" style="font-size:17px;">HIGH (by design)</div>
      </div>
    </div>
    <div class="rb-note">Composite rating based on cognitive vulnerability, decision context and observed safeguards.</div>

    <div class="section-block">
      <div class="section-heading"><h2>1 · Vulnerability Profile</h2><span class="sh-q">Where are the vulnerabilities?</span></div>
      <div class="section-panel">
        ${SCENARIOS.map(sc => {
          const r = state.results[sc.id];
          return `
            <div class="vuln-row">
              <div class="vuln-top"><span class="vuln-name">${CONSTRUCT_LABELS[sc.id]}</span><span class="vuln-level ${r.level}">${r.level.toUpperCase()}</span></div>
              <div class="scale-track"><div class="scale-marker ${r.level}" style="left:${scalePosition(r.level)}%;"></div></div>
              <div class="scale-labels"><span>Weak</span><span>Moderate</span><span>Strong</span></div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="section-block">
      <div class="section-heading"><h2>2 · Contextual Triggers</h2><span class="sh-q">Under which conditions can they intensify?</span></div>
      <div class="section-panel">
        <div class="tag-list">
          ${triggers.map(t => `<span class="tag-chip ${t.active ? 'warn' : ''}">${t.text}</span>`).join('')}
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="section-heading"><h2>3 · Observed Decision Safeguards</h2><span class="sh-q">What protective behaviours are already present?</span></div>
      <div class="section-panel">
        <div class="safeguard-list">
          ${SCENARIOS.map(sc => {
            const r = state.results[sc.id];
            const txt = r.controlActive ? SAFEGUARD_TEXT[sc.id].good : SAFEGUARD_TEXT[sc.id].bad;
            return `<div class="safeguard-row ${r.controlActive ? 'good' : 'bad'}"><span class="sg-name">${CONSTRUCT_LABELS[sc.id]}</span><span class="sg-obs">${txt}</span></div>`;

    <div class="footer-note">
      This profile reflects demonstrative scoring rules used for prototype purposes. In the full framework, each rating derives from the evidence rubric defined in the Cognitive Assessment Model, based on a single scenario per construct — sufficient for a proof of concept, not yet a psychometrically validated measure.

}

/* ============ LONGITUDINAL (VISION — MOCKUP) ============ */

function classifyLongi(v) {
  if (v >= 65) return { label: 'HIGH', cls: 'high-cell' };
  if (v >= 50) return { label: 'ELEVATED', cls: 'elevated-cell' };
  if (v >= 30) return { label: 'MODERATE', cls: 'moderate-cell' };
  return { label: 'LOW', cls: 'low-cell' };
}

function renderLongitudinal() {
  const quarters = ['Q1 2026', 'Q2 2026', 'Q3 2026', 'Q4 2026', 'Q1 2027', 'Q2 2027'];
  const overallSeries = [78, 74, 69, 58, 52, 47];
  const constructSeries = {
    'Anchoring': [70, 68, 60, 55, 44, 38],
    'Confirmation bias': [55, 58, 50, 47, 40, 35],
    'Authority cues': [80, 76, 74, 60, 58, 50],
    'Automation bias': [62, 60, 58, 52, 48, 42]
  };
  const colors = { 'Anchoring': '#FF6152', 'Confirmation bias': '#F5A623', 'Authority cues': '#7C8CFF', 'Automation bias': '#46D18A' };

  const w = 900, h = 260, padL = 40, padR = 20, padT = 20, padB = 30;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xStep = plotW / (quarters.length - 1);
  const yScale = v => padT + plotH - (v / 100) * plotH;
  function pathFor(series) { return series.map((v, i) => `${i === 0 ? 'M' : 'L'} ${padL + i * xStep} ${yScale(v)}`).join(' '); }

  const overallPath = pathFor(overallSeries);
  const constructPaths = Object.entries(constructSeries).map(([name, series]) =>
    `<path d="${pathFor(series)}" fill="none" stroke="${colors[name]}" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.55" />`
  ).join('');

  const gridLines = [0, 25, 50, 75, 100].map(v =>
    `<line x1="${padL}" y1="${yScale(v)}" x2="${w - padR}" y2="${yScale(v)}" stroke="#232C3A" stroke-width="1" />
     <text x="${padL - 8}" y="${yScale(v) + 4}" font-family="JetBrains Mono" font-size="10" fill="#526075" text-anchor="end">${v}</text>`
  ).join('');
  const xLabels = quarters.map((q, i) =>
    `<text x="${padL + i * xStep}" y="${h - 8}" font-family="JetBrains Mono" font-size="9.5" fill="#526075" text-anchor="middle">${q}</text>`
  ).join('');
  const overallDots = overallSeries.map((v, i) =>
    `<circle cx="${padL + i * xStep}" cy="${yScale(v)}" r="3.5" fill="#4FE0D6" style="filter: drop-shadow(0 0 4px rgba(79,224,214,0.7));" />`
  ).join('');

  const rows = quarters.map((q, i) => {
    const cells = Object.keys(constructSeries).map(name => {
      const c = classifyLongi(constructSeries[name][i]);
      return `<td class="${c.cls}">${c.label}</td>`;
    }).join('');
    return `<tr><td>${q}</td><td style="font-family:var(--mono);">${overallSeries[i]}</td>${cells}</tr>`;
  }).join('');

  app.innerHTML = `
    ${topbar()}
    <span class="demo-flag">Roadmap mockup — illustrative seeded data, not a live tracking engine</span>
    <div class="dash-header">
      <div class="dash-title">Cognitive Risk — Longitudinal View</div>
      <div class="dash-sub">QUARTERLY REASSESSMENT CYCLE · INDIVIDUAL TREND, NOT ORGANISATIONAL AGGREGATE</div>
    </div>

    <div class="longi-chart">
      <div class="longi-svg-wrap">
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          ${gridLines}
          ${constructPaths}
          <path d="${overallPath}" fill="none" stroke="#4FE0D6" stroke-width="2.2" style="filter: drop-shadow(0 0 3px rgba(79,224,214,0.5));" />
          ${overallDots}
          ${xLabels}
        </svg>
      </div>
      <div class="longi-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#4FE0D6; box-shadow:0 0 6px rgba(79,224,214,0.6);"></span>Overall Cognitive Risk Index (illustrative)</div>
        ${Object.entries(colors).map(([name, c]) => `<div class="legend-item"><span class="legend-dot" style="background:${c};"></span>${name}</div>`).join('')}
      </div>
    </div>

    <div class="longi-chart" style="padding:0; overflow-x:auto;">
      <table class="session-table">
        <thead><tr><th>Cycle</th><th>Overall index</th><th>Anchoring</th><th>Confirmation</th><th>Authority</th><th>Automation</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="footer-note">
      This view illustrates the intended longitudinal monitoring concept described in the project roadmap. Data shown here is seeded for demonstration only. Overall index values are framework-derived illustrative scores for prototype demonstration purposes, not psychometrically validated measurements. In the live architecture, cadence between sessions would not be tied directly to score improvement, to avoid incentivising response gaming.
    </div>

    <div class="action-row">
      <button class="btn-ghost" onclick="goToDashboard()">← BACK TO ASSESSMENT RESULT</button>
      <button class="btn-ghost" onclick="location.reload()">↺ RESTART DEMO</button>
    </div>
  `;
}

render();
</script>
</body>
